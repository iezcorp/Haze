	/* Volume bridge: lets the outer site control game volume via postMessage.
	   Unity WebGL plays through Web Audio, so every AudioContext created from
	   here on gets its output routed through one master gain that we own. */
	(function () {
		var volume = 1;
		var masters = [];
		function applyMedia() {
			var media;
			try { media = document.querySelectorAll("audio,video"); } catch (e) { return; }
			for (var j = 0; j < media.length; j++) {
				try { media[j].volume = volume; } catch (e) {}
			}
		}
		function apply(v) {
			volume = Math.min(1, Math.max(0, v));
			for (var i = 0; i < masters.length; i++) {
				try { masters[i].gain.value = volume; } catch (e) {}
			}
			applyMedia();
		}
		function patchContext(name) {
			var Real = window[name];
			if (!Real || Real.__volBridged) return;
			function Bridged() {
				var args = Array.prototype.slice.call(arguments);
				var ctx;
				try {
					var Bound = Function.prototype.bind.apply(Real, [null].concat(args));
					ctx = new Bound();
				} catch (e) {
					try { ctx = new Real(); } catch (err) { return null; }
				}
				try {
					var realDest = ctx.destination;
					var g = ctx.createGain();
					g.gain.value = volume;
					g.connect(realDest);
					masters.push(g);
					Object.defineProperty(ctx, "destination", {
						configurable: true,
						get: function () { return g; }
					});
				} catch (e) {}
				return ctx;
			}
			Bridged.prototype = Real.prototype;
			Bridged.__volBridged = true;
			try { window[name] = Bridged; } catch (e) {}
		}
		patchContext("AudioContext");
		patchContext("webkitAudioContext");
		if (window.MutationObserver && document.documentElement) {
			new MutationObserver(function () { applyMedia(); }).observe(document.documentElement, { childList: true, subtree: true });
		}
		window.addEventListener("message", function (e) {
			var d = e && e.data;
			if (d && d.type === "game-volume" && typeof d.value === "number") apply(d.value);
		});
		window.__setGameVolume = apply;
	})();
